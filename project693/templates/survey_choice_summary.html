{% extends "site_layout.html" %}
{% block title %}Survey Choices Summary{% endblock %}

{% block content %}

<div class="w-full px-6 md:w-2/3 pt-4 mx-auto">
  <div class="flex justify-between items-center">
    <section class="text-2xl font-medium mt-4 mb-6 py-3">
        Your choices: 5 invasive plants, 5 non-invasive plants.
    </section>
    <div class="flex flex-col">
      <div class="inline-flex items-center">
        <span class="size-2 inline-block bg-red-600 rounded-full me-2"></span>
        <span class="text-gray-600">Invasive</span>
      </div>
      <div class="inline-flex items-center">
        <span class="size-2 inline-block bg-green-600 rounded-full me-2"></span>
        <span class="text-gray-600">Non-Invasive</span>
      </div>
    </div>
  </div>
  
  <section id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      {% for plant in plants %}
      <article 
        class="
          py-9 px-4 rounded-2xl shadow-sm bg-white border border-gray-900 cursor-pointer hover:shadow-md transition
          {{ 'text-red-600' if plant.invasive else 'text-green-600' }}"
        data-hs-overlay="#hs-offcanvas-nav-with-backdrop"
      >
        <h2 class="text-xl font-medium truncate">{{ plant.name }}</h2>
      </article>
      {% endfor %}
  </section>

  <div id="hs-offcanvas-nav-with-backdrop" class="hs-overlay hs-overlay-open:translate-x-0 hs-overlay-backdrop-open:bg-blue-950/50 hidden translate-x-full fixed top-0 end-0 transition-all duration-300 transform h-full max-w-lg w-full z-80 bg-white border-e border-gray-200">
    <div class="flex justify-between items-center py-3 px-4 border-b border-gray-200">
      <h3 id="hs-offcanvas-example-label" class="font-bold text-gray-800">
        Charts Navigation
      </h3>
      <button type="button" class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200" data-hs-overlay="#hs-offcanvas-nav-with-backdrop">
        <span class="sr-only">Close</span>
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
    Content Here
  </div>
</div>

{% endblock %}
